<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感谢支持 - Portfolio</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel: rgba(255, 255, 255, 0.05);
            --accent: #ff6b1a;
            --text: #f5f5f5;
            --muted: #8a8f98;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .bg-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            50% { transform: translateY(-30px) translateX(10px); opacity: 0.6; }
        }

        .content {
            position: relative;
            z-index: 1;
            padding: 80px 40px;
            max-width: 1100px;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
        }

        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .heart-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            animation: heartbeat 2s ease-in-out infinite;
        }

        .heart-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--accent);
            filter: drop-shadow(0 0 20px rgba(255, 107, 25, 0.5));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
        }

        .content-image {
            width: 100%;
            max-width: 420px;
            height: auto;
            border-radius: 16px;
            display: block;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .content-image:hover {
            transform: scale(1.02);
        }

        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--accent), #ff8533);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 16px;
            color: var(--muted);
            line-height: 1.8;
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            color: var(--muted);
            line-height: 1.8;
            margin-bottom: 40px;
            max-width: 440px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--muted);
        }

        .contact-item svg {
            width: 18px;
            height: 18px;
            color: var(--accent);
            flex-shrink: 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(255, 107, 25, 0.4);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
        }

        .footer-note {
            margin-top: 40px;
            font-size: 13px;
            color: var(--muted);
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                gap: 40px;
                padding: 60px 24px;
            }

            .right-section {
                align-items: center;
                text-align: center;
            }

            h1 {
                font-size: 32px;
            }

            p {
                max-width: 100%;
            }

            .contact-info {
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="particles"></div>

    <div class="content">
        <div class="left-section">
            <img src="./images/影视/0.jpg" alt="感谢支持" class="content-image">
        </div>

        <div class="right-section">
            <div class="heart-icon">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <h1>感谢你的关注</h1>
            <p class="subtitle">每一份认可都是我前进的动力</p>
            <p>如果你有任何项目想法或合作意向，欢迎随时与我联系。无论是摄影创作、舞台剧视觉设计，还是跨领域的艺术合作，我都很期待与你交流。</p>

            <div class="contact-info">
                <div class="contact-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    <span>1352205906@QQ.com</span>
                </div>
                <div class="contact-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    <span>+86 133 3102 8675</span>
                </div>
                <div class="contact-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4C5.36 4 2 6.69 2 10c0 1.89 1.08 3.56 2.78 4.66L4 17l2.5-1.19c.82.23 1.7.36 2.61.38-.1-.45-.16-.92-.16-1.41 0-3.31 3.13-6 7-6 .46 0 .91.04 1.34.11C17.1 5.93 13.67 4 9.5 4z"/><path d="M22 14.5c0-2.76-2.69-5-6-5s-6 2.24-6 5 2.69 5 6 5c.78 0 1.53-.12 2.22-.34L20 20l-.5-2.17C21.42 17.03 22 15.82 22 14.5z"/></svg>
                    <span>HiQaulityMut</span>
                </div>
            </div>

            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                返回首页
            </a>
            <div class="footer-note">Portfolio · 2026</div>
        </div>
    </div>

    <script>
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 8 + 's';
            p.style.animationDuration = (6 + Math.random() * 6) + 's';
            p.style.width = (2 + Math.random() * 4) + 'px';
            p.style.height = p.style.width;
            particlesContainer.appendChild(p);
        }
    </script>
</body>
</html>
